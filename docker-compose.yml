
services:
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/sessions:/app/sessions
      - ./backend/job_results:/app/job_results
      - ./backend/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    networks:
      - app-network

  worker:
    build: ./backend
    command: ["celery", "-A", "celery_app", "worker", "-l", "info", "--concurrency=4", "--prefetch-multiplier=1"]
    env_file:
      - ./backend/.env
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - ./backend/sessions:/app/sessions
      - ./backend/job_results:/app/job_results
      - ./backend/uploads:/app/uploads
    restart: unless-stopped
    networks:
      - app-network
    deploy:
      replicas: 1

  worker-long:
    build: ./backend
    command: ["celery", "-A", "celery_app", "worker", "-Q", "long_tasks", "-l", "info", "--concurrency=1", "--prefetch-multiplier=1"]
    env_file:
      - ./backend/.env
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - ./backend/sessions:/app/sessions
      - ./backend/job_results:/app/job_results
      - ./backend/uploads:/app/uploads
    restart: unless-stopped
    networks:
      - app-network
    deploy:
      replicas: 1

  worker-short:
    build: ./backend
    command: ["celery", "-A", "celery_app", "worker", "-Q", "short_tasks", "-l", "info", "--concurrency=3", "--prefetch-multiplier=1"]
    env_file:
      - ./backend/.env
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - ./backend/sessions:/app/sessions
      - ./backend/job_results:/app/job_results
      - ./backend/uploads:/app/uploads
    restart: unless-stopped
    networks:
      - app-network
    deploy:
      replicas: 1

  celery-beat:
    build: ./backend
    command: ["celery", "-A", "celery_app", "beat", "-l", "info"]
    env_file:
      - ./backend/.env
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - ./backend/sessions:/app/sessions
      - ./backend/job_results:/app/job_results
      - ./backend/uploads:/app/uploads
    restart: unless-stopped
    networks:
      - app-network

  flower:
    build: ./backend
    command: ["celery", "-A", "celery_app", "flower", "--port=5555", "--broker=redis://redis:6379/0"]
    environment:
      - FLOWER_UNAUTHENTICATED_API=true
    env_file:
      - ./backend/.env
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5555/api/workers"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - app-network

  db:
    image: postgres:13
    command: ["postgres", "-c", "max_connections=200"]
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=tg_tools
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d tg_tools"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - app-network

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-network
    command: >
      redis-server 
      --appendonly yes 
      --maxmemory 2gb 
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 60
      --timeout 0
      --tcp-backlog 511
      --databases 16
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - redis_data:/data

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
